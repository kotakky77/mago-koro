# Cloudflare Workers 版の開発環境。PCにNodeを入れずコンテナ内で完結させる。
#
#   初回:        docker compose run --rm dev npm install
#   マイグレーション: docker compose run --rm dev npx wrangler d1 migrations apply mago-koro --local
#   開発サーバー:  docker compose up          → http://localhost:8787
#   テスト:       docker compose run --rm dev npm test
#   型チェック:    docker compose run --rm dev npm run typecheck
#   デプロイ:     docker compose run --rm dev npx wrangler deploy
#                （.env に CLOUDFLARE_API_TOKEN=... を書いておくと対話ログイン不要）
#
# 旧Rails版の docker-compose.yml (web:3000 / db:3306) とはポートもプロジェクトも
# 衝突しないので共存できる。
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npx wrangler dev --ip 0.0.0.0
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      # workerd などのバイナリはプラットフォーム別なので、ホストと共有しない
      - node_modules:/app/node_modules
    environment:
      WRANGLER_SEND_METRICS: "false"
    env_file:
      - path: .env
        required: false
    tty: true
    stdin_open: true

volumes:
  node_modules:
