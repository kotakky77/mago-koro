version: 2
updates:
  # Cloudflare Workers 版の依存（hono / wrangler / vitest 等）
  # Rails 版は archive/rails/ にアーカイブ済みのため bundler は監視しない
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    # 実行環境は node:22（Dockerfile.dev / package.json の engines >=22）。
    # 型だけ先行して上げると Node 22 にない API が typecheck を通ってしまうので major は無視する
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # マイナー・パッチはまとめて1本のPRにしてノイズを減らす
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # .github/workflows/ci.yml の actions バージョンを監視する
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
